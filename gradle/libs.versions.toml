# Gradle version catalog — single source of truth for the Kotlin lint/format toolchain versions.
#
# Deliberately partial: only the lint toolchain lives here so the Gradle plugin, the pre-commit
# hook's standalone CLI jars, and `verifyKtfmtAlignment` all read the same versions and can never
# drift. Other dependency versions (Kotlin, AGP, Compose, AndroidX) remain inline in the
# build.gradle.kts files for now — a partial catalog is intentional.
#
# `ktfmt` is the ncorti Gradle plugin; `ktfmt-cli` is the `com.facebook:ktfmt` formatter the plugin
# bundles AND the standalone jar the pre-commit hook invokes. These two MUST stay aligned: ncorti
# plugin 0.27.0 bundles com.facebook:ktfmt 0.64, so local Gradle, the hook, and CI all format
# identically. `verifyKtfmtAlignment` enforces this pairing mechanically.

[versions]
ktfmt = "0.27.0"
ktfmt-cli = "0.64"
detekt = "1.23.8"
# santimattius structured-coroutines Detekt ruleset — 40 syntactic coroutine rules. Being syntactic
# (no type resolution) they run on the plain `detekt` task, unlike Detekt's own coroutine rules,
# which need type resolution the Kotlin-version wall (detekt 1.23.8 bundles Kotlin 2.0.21, this repo
# runs Kotlin 2.4.10) makes inert here. Consumed via `detektPlugins` in each module and `--plugins`
# in the pre-commit hook — bump both in lockstep. An upstream port is needed when Detekt 2.0 renames
# the RuleSetProvider package to `dev.detekt`.
structured-coroutines = "1.1.0"
# skydoves Compose Stability Analyzer is a Kotlin compiler plugin, so it is hard-pinned to a Kotlin
# version (it embeds kotlin-compiler-embeddable). The project runs Kotlin 2.4.10; the analyzer's
# version→Kotlin map has no 2.4.10 build, so 0.12.0 (built against Kotlin 2.4.0 — the nearest
# version at or below 2.4.10) is used for forward-compatible loading. Bump this in lockstep with any
# Kotlin upgrade using the analyzer's README "Kotlin Version Mapping" table: a version built against
# a Kotlin older than the compiler that loads it fails the build with a ClassCastException on
# FirExtensionRegistrarAdapter as the plugin registers its FIR extensions.
compose-stability-analyzer = "0.12.0"

[libraries]
# The structured-coroutines ruleset jar. Consumed off this one coordinate in two ways: `detektPlugins`
# in :shared/:androidApp (the Gradle `detekt` task) and the root `detektRuleset` configuration that
# `resolveLintTools` hands to the pre-commit hook's detekt-cli via `--plugins`.
structured-coroutines-detekt-rules = { module = "io.github.santimattius:structured-coroutines-detekt-rules", version.ref = "structured-coroutines" }

[plugins]
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
compose-stability-analyzer = { id = "com.github.skydoves.compose.stability.analyzer", version.ref = "compose-stability-analyzer" }

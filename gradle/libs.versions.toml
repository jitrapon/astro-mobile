# Gradle version catalog — single source of truth for build-plugin and product dependency versions.
#
# Three families live here:
#
#   * The Kotlin lint/format toolchain, so the Gradle plugin, the pre-commit hook's standalone CLI
#     jars, and `verifyKtfmtAlignment` all read the same versions and can never drift.
#   * The product dependencies the shared module ships (kotlinx.serialization, kotlinx.coroutines,
#     Ktor, Koin) together with the Kotlin version their compiler plugins are locked to, plus the
#     Android app's own (Compose, AndroidX Lifecycle and Activity, Navigation 3). No module declares
#     a dependency version inline.
#   * The build tooling the security gates drive — the CycloneDX SBOM generator whose output the
#     PR-blocking `sca` job scans. It ships nothing, but a bump changes what that gate can see.
#
# Two versions stay outside this file, both deliberately. Android Gradle Plugin remains declared
# inline in the root `buildscript` classpath — it is the one build-plugin version with no catalog
# consumer and no lockstep partner. The foojay toolchain resolver is pinned in `settings.gradle.kts`
# because a settings plugin is resolved before this catalog is loaded, so it cannot be read from it.
#
# `kotlin` and `compose-stability-analyzer` MUST move together: the analyzer is a Kotlin compiler
# plugin built against one exact Kotlin release. Unlike the ktfmt pairing below, the right analyzer
# version cannot be derived from the Kotlin one — the pairing exists only in the analyzer README —
# so `verifyStabilityAnalyzerKotlinAlignment` holds a transcribed table and fails the build when
# the two refs disagree with it, or when `kotlin` moves to a version the table does not cover.
#
# `ktfmt` is the ncorti Gradle plugin; `ktfmt-cli` is the `com.facebook:ktfmt` formatter the plugin
# bundles AND the standalone jar the pre-commit hook invokes. These two MUST stay aligned: ncorti
# plugin 0.27.0 bundles com.facebook:ktfmt 0.64, so local Gradle, the hook, and CI all format
# identically. `verifyKtfmtAlignment` enforces this pairing mechanically.

[versions]
# The Kotlin version every Kotlin *compiler* plugin on the buildscript classpath is locked to. The
# Kotlin Gradle plugin, the Compose compiler plugin, and the kotlinx.serialization plugin all embed
# compiler internals, so a mismatch against the Kotlin the build runs is a hard failure, not a
# warning. Those three read this ref and so move with it. compose-stability-analyzer below does not
# — it is a compiler plugin versioned on its own, with an exact-match Kotlin build rather than a
# range — so `verifyStabilityAnalyzerKotlinAlignment` fails every `check` when this ref moves
# without it, including a move to a Kotlin version the guard's table does not cover yet.
kotlin = "2.4.20"
ktfmt = "0.27.0"
ktfmt-cli = "0.64"
detekt = "1.23.8"
# santimattius structured-coroutines Detekt ruleset — 40 syntactic coroutine rules. Being syntactic
# (no type resolution) they run on the plain `detekt` task, unlike Detekt's own coroutine rules,
# which need type resolution the Kotlin-version wall (detekt 1.23.8 bundles Kotlin 2.0.21, this repo
# runs Kotlin 2.4.20) makes inert here. Consumed via `detektPlugins` in each module and `--plugins`
# in the pre-commit hook — bump both in lockstep. An upstream port is needed when Detekt 2.0 renames
# the RuleSetProvider package to `dev.detekt`.
structured-coroutines = "1.1.1"
# skydoves Compose Stability Analyzer is a Kotlin compiler plugin, so it is hard-pinned to a Kotlin
# version (it embeds kotlin-compiler-embeddable) and upstream builds each analyzer release against
# one exact Kotlin release. This must be a release built against the `kotlin` ref above — 0.14.0 is
# the 2.4.20 build. `verifyStabilityAnalyzerKotlinAlignment` in the root build script enforces that
# in every `check`, against a table transcribed from the analyzer README's "Kotlin Version Mapping",
# and fails closed on a Kotlin version the table does not cover — so a Kotlin bump edits three
# places: both refs and that table. What it guards against is not a warning: a plugin built against
# a Kotlin older than the compiler loading it fails with a ClassCastException on
# FirExtensionRegistrarAdapter, but only as the plugin registers its FIR extensions, so a Kotlin
# bump that lands alone — a Renovate security bump, say — would otherwise compile by luck in every
# build that never reaches that path. Renovate is disabled for this ref for the same reason.
compose-stability-analyzer = "0.14.0"
# CycloneDX Gradle plugin — produces the SBOM the PR-blocking `sca` job hands to osv-scanner. It
# ships in no artifact; it exists so software-composition analysis reads the RESOLVED Gradle graph
# at PR time instead of waiting for the post-merge Dependency Graph inventory. Plugin 3.x needs
# Gradle 8.4+ and serializes CycloneDX schema 1.6 by default, which osv-scanner's CycloneDX
# extractor parses — opting into schema 1.7 requires re-proving the scanner still reads the
# document, so the default is left alone.
cyclonedx = "3.4.1"
# kotlinx.serialization RUNTIME. Versioned independently of the compiler plugin above: the plugin
# generates the serializers, this library supplies the format (JSON) they are encoded through.
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
# Ktor 3.x. One version spans every client artifact — core, the content-negotiation plugin, the
# kotlinx-json converter, both platform engines, and the MockEngine the tests drive — so they must
# be bumped together off this single ref.
ktor = "3.6.0"
# Koin — the shared module's DI container. Runtime resolution with no compile-time graph
# validation, so `koin-test`'s graph-resolution check is the only thing that catches a missing
# binding; keep the test artifact on the same version as the runtime.
koin = "4.2.2"
# Jetpack Navigation 3 — the Android app's navigation framework (a Compose-state back stack
# rendered by `NavDisplay`). `runtime` and `ui` release together and are bumped off this one ref.
navigation3 = "1.1.7"
# Jetpack Compose UI libraries — `ui` (with its tooling and test artifacts), `animation`, and
# `material`. AndroidX versions these groups independently, but the app has always held them to one
# release, and one ref keeps a bump from moving `ui` while leaving `ui-tooling` or the test
# artifacts a release behind it. Not every `androidx.compose` coordinate belongs here: the icon
# artifacts stopped releasing earlier and keep their own ref below.
compose = "1.12.1"
# AndroidX Lifecycle — `lifecycle-runtime-ktx` and `lifecycle-viewmodel-compose` release together.
androidx-lifecycle = "2.11.0"
# `activity-compose` — the `ComponentActivity.setContent` bridge. It belongs to the AndroidX
# Activity release train, not Compose's, so it is versioned on its own.
activity-compose = "1.13.0"
# Material icons (core set) — the app shell's tab icons. `material` pulls it in only as a runtime
# dependency, so the app declares it to compile against it. The icon artifacts stopped releasing at
# 1.7.8; this is its final version, not one to track alongside the Compose UI libraries.
compose-material-icons = "1.7.8"

[libraries]
# The structured-coroutines ruleset jar. Consumed off this one coordinate in two ways: `detektPlugins`
# in :shared/:androidApp (the Gradle `detekt` task) and the root `detektRuleset` configuration that
# `resolveLintTools` hands to the pre-commit hook's detekt-cli via `--plugins`.
structured-coroutines-detekt-rules = { module = "io.github.santimattius:structured-coroutines-detekt-rules", version.ref = "structured-coroutines" }

# Kotlin compiler plugins consumed as root `buildscript` classpath artifacts rather than through the
# `plugins {}` DSL, because the modules apply them by id with no version (`kotlin("multiplatform")`,
# `kotlin("plugin.serialization")`) and inherit the classpath version.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }

# Product dependencies — shared module.
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }

# Product dependencies — Android app.
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "compose-material-icons" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-compose-material = { module = "androidx.compose.material:material", version.ref = "compose" }
androidx-compose-animation = { module = "androidx.compose.animation:animation", version.ref = "compose" }
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
# Test-only. `ui-test-junit4` belongs on `androidTestImplementation`; on `implementation` it would
# ship in the release APK. No `ui-test-manifest`: instrumented tests run against the release variant,
# which a debug-only host-activity manifest never reaches, so they host in the app's MainActivity.
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }

[plugins]
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
compose-stability-analyzer = { id = "com.github.skydoves.compose.stability.analyzer", version.ref = "compose-stability-analyzer" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }

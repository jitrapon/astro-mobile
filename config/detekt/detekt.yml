# Detekt overrides layered on top of the bundled defaults (each module sets buildUponDefaultConfig =
# true). Two concerns live here:
#   1. Narrow Compose corrections — the two rules that conflict with idiomatic Jetpack Compose
#      (PascalCase @Composable functions; inline color literals in theme code). See `naming`/`style`.
#   2. Coroutine enforcement — Detekt's own `coroutines` block plus the third-party
#      `structured-coroutines` ruleset (bottom of this file), gated in tiers via `build.weights`
#      below. This is the machine-enforceable half of the kotlin-coroutines skill.
#
# This is NOT a mechanism to silence findings: no baseline file is used and @Suppress remains
# forbidden (enforced by checkNoDetektBaseline + Detekt's ForbiddenSuppress rule for the bare rule-id
# form, plus the semgrep rule kotlin-forbidden-detekt-suppress for the qualified/wildcard spellings
# ForbiddenSuppress cannot match). The Compose entries correct two rules that are simply wrong for
# Compose UI, not findings we are dodging.

build:
  maxIssues: 0
  excludeCorrectable: false
  weights:
    # -------------------------------------------------------------------------
    # WARN tier for the `structured-coroutines` ruleset (see that block at the
    # bottom of this file). Detekt gates the build on the WEIGHTED issue count
    # against maxIssues, so weight 0 means "report it, never fail on it". A rule
    # lands here for one of three reasons, tagged inline: (FP) a demonstrated
    # false positive, (HEURISTIC) a judgment a syntactic matcher can get wrong,
    # or (UNVERIFIED) not yet watched firing in this repo. Promote to the blocking
    # tier (drop the weight) only after a probe shows a true positive and no false
    # one.
    # -------------------------------------------------------------------------
    # (FP) also fires on `async { .. }.await()`, which IS awaited.
    UnusedDeferred: 0
    # (HEURISTIC) cannot know whether the two async calls are independent.
    SequentialAsyncAwait: 0
    # (HEURISTIC) cannot resolve whether the dispatchers are really the same.
    RedundantWithContext: 0
    # (HEURISTIC) a suspend call in `finally` is correct under NonCancellable.
    SuspendInFinally: 0
    # (HEURISTIC) a loop without yield is fine when it does not spin.
    LoopWithoutYield: 0
    # (HEURISTIC) the channel may be closed by a helper the rule cannot see.
    ChannelNotClosed: 0
    # (HEURISTIC) withTimeout around a non-cancellable bridge is a per-call
    # judgment the rule cannot make.
    WithTimeoutScopeCancellation: 0
    # New coroutine unit tests should prefer runTest, but an instrumented/
    # integration test may legitimately runBlocking over real I/O, so this stays a
    # per-test judgment until the coroutine test harness is exercised here.
    RunBlockingInsteadOfRunTest: 0
    RunBlockingWithDelayInTest: 0
    # (UNVERIFIED) not yet exercised by a probe here.
    CancellationExceptionSwallowed: 0
    BlockingCallInCoroutineBackend: 0
    ExternalScopeLaunch: 0
    ScopeReuseAfterCancel: 0
    RedundantLaunchInCoroutineScope: 0
    ConsumeEachMultipleConsumers: 0
    ThreadLocalNotPropagated: 0
    SharedMutableStateInCoroutine: 0
    MutableFlowExposed: 0
    # (UNVERIFIED) Flow/Channel rules. The repo uses neither construct today, so
    # these are armed for the branch that introduces one — not dead config: they
    # work, they simply have nothing to match yet.
    CallbackFlowWithoutAwaitClose: 0
    ChannelFlowVsCallbackFlow: 0
    FlowBlockingCall: 0
    MissingCatchInFlow: 0
    SharedFlowForOneshotEvents: 0
    SideEffectInMapOperator: 0
    StateInWithEagerlyStrategy: 0

naming:
  FunctionNaming:
    # Composable functions are PascalCase by Compose convention; exempt them from the camelCase rule.
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    # Compose theme color definitions (e.g. Color(0xFFBB86FC)) are inherently inline hex literals;
    # the named `val` already documents intent. Exempt the theme package only.
    excludes: ['**/theme/**']
  ForbiddenSuppress:
    # Off by default in Detekt; activated to forbid silencing findings via @Suppress /
    # @SuppressWarnings. Detekt's ForbiddenSuppress only flags a suppression whose argument is
    # listed in `rules` — an empty list forbids *nothing*. So every Detekt rule id is enumerated
    # here to reject suppression of any tracked finding repo-wide, with no path/boundary excludes.
    # This pairs with the checkNoDetektBaseline gate (no baseline file) to keep both finding-dodging
    # escape hatches closed; the only way to clear a finding is to refactor.
    #
    # LIMITATION (why this is not the whole gate): ForbiddenSuppress does exact-string matching, but
    # Detekt honors several equivalent spellings of the same suppression — `detekt:Rule` / `detekt.Rule`
    # (universal prefix), `<ruleset>:Rule` / `<ruleset>.Rule`, and the `all` / `ALL` wildcard — none of
    # which appear in this list, so ForbiddenSuppress alone would miss them. The semgrep rule
    # kotlin-forbidden-detekt-suppress (.semgrep/astro-mobile.yml) closes exactly those spellings; the
    # two gates together cover every form. This list stays the bare-id layer (fast, in-Detekt feedback).
    #
    # MAINTENANCE: this list is the full rule-id set of Detekt 1.23.8 (harvested from the plugin's
    # bundled default-detekt-config.yml). Regenerate it whenever the catalog's `detekt` version
    # changes, since new releases add rules a stale list would not cover.
    active: true
    rules:
      - AbsentOrWrongFileLicense
      - AlsoCouldBeApply
      - ArrayPrimitive
      - AvoidReferentialEquality
      - BooleanPropertyNaming
      - BracesOnIfStatements
      - BracesOnWhenStatements
      - CanBeNonNullable
      - CascadingCallWrapping
      - CastNullableToNonNullableType
      - CastToNullableType
      - ClassNaming
      - ClassOrdering
      - CognitiveComplexMethod
      - CollapsibleIfStatements
      - CommentOverPrivateFunction
      - CommentOverPrivateProperty
      - ComplexCondition
      - ComplexInterface
      - ConstructorParameterNaming
      - CouldBeSequence
      - CyclomaticComplexMethod
      - DataClassContainsFunctions
      - DataClassShouldBeImmutable
      - DeprecatedBlockTag
      - Deprecation
      - DestructuringDeclarationWithTooManyEntries
      - DontDowncastCollectionTypes
      - DoubleMutabilityForCollection
      - DoubleNegativeLambda
      - ElseCaseInsteadOfExhaustiveWhen
      - EmptyCatchBlock
      - EmptyClassBlock
      - EmptyDefaultConstructor
      - EmptyDoWhileBlock
      - EmptyElseBlock
      - EmptyFinallyBlock
      - EmptyForBlock
      - EmptyFunctionBlock
      - EmptyIfBlock
      - EmptyInitBlock
      - EmptyKtFile
      - EmptySecondaryConstructor
      - EmptyTryBlock
      - EmptyWhenBlock
      - EmptyWhileBlock
      - EndOfSentenceFormat
      - EnumNaming
      - EqualsAlwaysReturnsTrueOrFalse
      - EqualsNullCall
      - EqualsOnSignatureLine
      - EqualsWithHashCodeExist
      - ExceptionRaisedInUnexpectedLocation
      - ExitOutsideMain
      - ExplicitCollectionElementAccessMethod
      - ExplicitGarbageCollectionCall
      - ExplicitItLambdaParameter
      - ExpressionBodySyntax
      - ForbiddenAnnotation
      - ForbiddenClassName
      - ForbiddenComment
      - ForbiddenImport
      - ForbiddenMethodCall
      - ForbiddenSuppress
      - ForbiddenVoid
      - ForEachOnRange
      - FunctionMaxLength
      - FunctionMinLength
      - FunctionNaming
      - FunctionOnlyReturningConstant
      - FunctionParameterNaming
      - GlobalCoroutineUsage
      - HasPlatformType
      - IgnoredReturnValue
      - ImplicitDefaultLocale
      - ImplicitUnitReturnType
      - InjectDispatcher
      - InstanceOfCheckForException
      - InvalidPackageDeclaration
      - InvalidRange
      - IteratorHasNextCallsNextMethod
      - IteratorNotThrowingNoSuchElementException
      - KDocReferencesNonPublicProperty
      - LabeledExpression
      - LambdaParameterNaming
      - LargeClass
      - LateinitUsage
      - LongMethod
      - LongParameterList
      - LoopWithTooManyJumpStatements

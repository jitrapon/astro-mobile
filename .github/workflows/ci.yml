name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# `./gradlew check` stays the single local gate (see CLAUDE.md). CI splits that same work across two
# runners so the expensive macOS runner (~10x the per-minute cost of Linux) only carries the
# genuinely Mac-bound surface. The split is defined once in the root build as two aggregate tasks —
# verifyAndroidCommon (host-portable) and verifyIos (macOS-only) — and the `verifyCheckPartition`
# drift guard (run as part of verifyAndroidCommon) fails the build if their union ever stops equaling
# what `check` runs, so local and CI can't silently diverge.
jobs:
  verify-android-common:
    # Host-portable half of `check`: Android build/unit tests, JVM/common (host) tests, and Kotlin
    # static-analysis + formatting (Detekt + ktfmt over every source set, iosMain Kotlin included —
    # parsing needs no Mac, only iOS *compilation* does). Runs on the cheap Linux runner. This job
    # also runs verifyCheckPartition, so a partition drift fails here regardless of the macOS job.
    name: verify-android-common
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This repository only. `docs/astro-docs` is a private cross-repo submodule and the
          # default GITHUB_TOKEN is scoped to this repo, so asking checkout to resolve it here
          # would fail the clone outright. It is fetched by the two steps below instead, with a
          # credential that can actually read it.
          submodules: false

      # `docs/astro-docs` is a build input on this half of the split, notwithstanding that it holds
      # planning docs: it is the upstream mirror `verifyVendoredContractParity` compares the
      # vendored `contracts/astro-bff/openapi.yaml` and screen fixture against. That gate is
      # deliberately fail-closed — a skipped parity check is indistinguishable from a passing one —
      # so the submodule is not optional here.
      #
      # The key is loaded into an agent rather than passed to checkout's `ssh-key:` input, because
      # that input also governs the MAIN repository's clone and would therefore demand a credential
      # valid for both repos. Keeping them separate leaves the main checkout on GITHUB_TOKEN and
      # gives the submodule its own read-only deploy key.
      #
      # Requires the `ASTRO_DOCS_DEPLOY_KEY` secret (private half of a read-only deploy key on
      # `jitrapon/astro-docs`). Absent it, this step fails and the job goes red — the intended
      # behaviour, since the alternative is a green build whose parity gate never ran.
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.ASTRO_DOCS_DEPLOY_KEY }}

      - run: git submodule update --init --recursive

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      # Provides the Gradle dependency/build cache. No `gradle-version` — the repo's committed
      # wrapper (Gradle 9.x) is authoritative.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - run: ./gradlew verifyAndroidCommon

      # Build coverage beyond `check`: assemble the APKs (the release variant exercises R8/minify).
      # Deliberately outside the verifyCheckPartition guard — assembling an artifact is not a `check`
      # task, it's an extra packaging assurance. Reuses the Kotlin already compiled by the step above.
      - run: ./gradlew :androidApp:assemble

  verify-ios:
    # macOS-only half of `check`: the shared module's iOS simulator tests (Kotlin/Native cross-
    # compiles iOS targets only on a macOS host) plus the Swift gates. `swift` ships with the
    # runner's Xcode and `swiftlint` is installed below, so swiftFormatCheck/swiftLintCheck enforce
    # here instead of self-skipping — full parity with the Kotlin ktfmt + Detekt gate.
    name: verify-ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No submodule here, and no deploy key: `verifyVendoredContractParity` is classified into
          # the host-portable aggregate, so nothing this job runs reads the astro-docs mirror.
          # Fetching a private submodule onto the expensive runner to satisfy no gate would be cost
          # and credential exposure for nothing.
          submodules: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # SwiftLint is not toolchain-bundled (unlike swift-format, which ships with Xcode). Without it
      # swiftLintCheck self-skips; install it so the iOS static-analysis gate enforces in CI.
      - run: brew install swiftlint

      - run: ./gradlew verifyIos

      # Compile coverage beyond `check`: build the Swift app target against the shared framework.
      # This is the only gate that type-checks Kotlin-declared symbols at their Swift call sites —
      # swiftFormatCheck and swiftLintCheck parse Swift without resolving the generated framework
      # header, so a renamed or removed Kotlin declaration passes both of them and still breaks the
      # app. Outside the verifyCheckPartition guard for the same reason as the Android assemble and
      # the release link below: it is build coverage, not a `check` task.
      #
      # Placement immediately after verifyIos is about cost, not order — no earlier step produces
      # the artifact this needs. linkReleaseFrameworkIosArm64 links the *device release* framework,
      # while the app target's own first build phase resolves $(CONFIGURATION)/$(SDK_NAME) and
      # invokes Gradle for the *debug simulator* one. Running here reuses the iosSimulatorArm64
      # klibs verifyIos just compiled, so the added work on this runner is a framework link rather
      # than a second Kotlin/Native compile.
      #
      # Invoked as xcodebuild rather than wrapped in a Gradle task because that same build phase
      # already shells out to ./gradlew: nesting would put one Gradle build inside another,
      # contending for the same project locks.
      #
      # ARCHS=arm64 keeps the destination generic — no booted device, no pinned runtime version, so
      # a runner-image bump cannot break it — while holding the build to the one KMP target CI
      # already compiles. A generic simulator destination otherwise resolves ARCHS = arm64 x86_64
      # and drags in a complete second Kotlin/Native target compile (iosX64) that nothing else here
      # builds; ONLY_ACTIVE_ARCH cannot substitute, as Xcode force-resets it to NO for generic
      # destinations. CODE_SIGNING_ALLOWED=NO is what lets a credential-less runner through: the
      # iphonesimulator SDK already forces an ad-hoc identity, and this drops the CodeSign phases
      # entirely. DEVELOPMENT_TEAM="" blanks the one setting the project pins to a real team, so
      # nothing credential-shaped is left in the invocation. Output is left unformatted — no log
      # formatter to install, and a raw xcodebuild failure stays diagnosable.
      - run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath iosApp/build/DerivedData \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      # Build coverage beyond `check`: link the shipping iOS device framework with release codegen.
      # Outside the verifyCheckPartition guard for the same reason as the Android assemble — it's an
      # artifact-link assurance, not a `check` task. The iOS Kotlin already compiled for the tests
      # above, so this just exercises the release link of the framework the iosApp consumes.
      - run: ./gradlew :shared:linkReleaseFrameworkIosArm64
